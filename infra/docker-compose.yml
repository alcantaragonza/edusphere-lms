services:
  postgres:
    image: postgres:15
    container_name: edusphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edusphere
      POSTGRES_PASSWORD: edusphere_pass
      POSTGRES_DB: edusphere_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    container_name: edusphere_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: edusphere
      MONGO_INITDB_ROOT_PASSWORD: edusphere_pass
      MONGO_INITDB_DATABASE: edusphere_db
    volumes:
      - mongodata:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:

networks:
  default:
    driver: bridge