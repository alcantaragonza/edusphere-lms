# ==================================================================
# Configuracion WAL — Backup Incremental PostgreSQL
# ==================================================================
# Estas lineas se agregan al postgresql.conf del contenedor Docker
# para habilitar el archivado de WAL (Write-Ahead Log).
#
# WAL permite Point-In-Time Recovery (PITR):
#   - Backup completo: 1 vez por semana (pg_dump)
#   - WAL: cada cambio se guarda en archivos de ~16MB
#   - Si la BD falla un miercoles, restauras el backup del domingo
#     + los WAL hasta 1 minuto antes del fallo.
#
# Para aplicar:
#   docker cp infra/postgresql.conf edusphere_postgres:/etc/postgresql/postgresql.conf
#   docker restart edusphere_postgres
# ==================================================================

# Nivel de WAL: 'replica' es suficiente para PITR
# (NO usar 'minimal' porque no guarda suficientes datos para restore)
wal_level = replica

# Activar el archivado automatico de WAL
archive_mode = on

# Comando para archivar cada segmento WAL completado
# %p = path del archivo WAL, %f = nombre del archivo
# Los archivos se copian a una carpeta dedicada dentro del contenedor
archive_command = 'test ! -f /var/lib/postgresql/data/wal_archive/%f && cp %p /var/lib/postgresql/data/wal_archive/%f'

# Tamaño maximo de cada archivo WAL (16MB por defecto)
# Con alta actividad, se genera un archivo cada pocos minutos
wal_keep_size = 1GB
